name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # One checkout. go.mod requires the modules below this one by version, so
      # this job resolves them the way anyone depending on this module does --
      # which is the point of running it: a green run says the published
      # dependencies are enough to build and test this commit.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run always reflects
      # the commit it ran on. -coverpkg is needed because the suites live
      # outside the packages they exercise.
      - name: Test
        run: go test -count=1 -coverpkg=./... ./...

      - name: Race
        run: go test -race -count=1 ./...

      # Generated code is checked in, so a description changed without a
      # regeneration is caught here as well as by the drift test.
      #
      # status and not diff alone: a generator writing to the wrong path leaves
      # an untracked file, which a diff does not see -- so the step passed
      # while regenerating nothing.
      - name: Generated code
        run: |
          go generate ./...
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Examples
        run: go run ./examples/cmd/schemademo
